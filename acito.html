  <div class="riga-titolo" style="display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); align-items: start; gap: 4vw; padding: 26px 4vw 20px">
    <h1 class="titolo" style="margin: 0; font-weight: 900; font-size: 3.2vw; line-height: .95; letter-spacing: -.035em; text-transform: uppercase">Monica Acito: un racconto e un punto di vista</h1>
    <div>
      <p style="margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: #2A2A2A">Una rivista dedicata a Monica Acito e al suo universo narrativo, realizzata insieme a due amici. Ci siamo occupati di scrittura, fotografia e impaginazione.</p>
      <p class="cornice" style="margin: 0; color: #6CC3F0">Progetto universitario · UniRSM 2025 · Rivista, 68 pagine</p>
      <button type="button" class="cornice scorri7" onClick="{{scorri}}">Approfondisci +</button>
    </div>

    <button type="button" class="freccia" onClick="{{prev}}" aria-label="Pagina precedente"><svg class="fz7 sx7" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.9 5 H8.3"/><path d="M5.1 1.7 L8.4 5 L5.1 8.3"/></svg></button>
    <span style="font-weight: 700; font-size: 15px; letter-spacing: .04em; min-width: 80px; text-align: center; font-variant-numeric: tabular-nums">{{contatore}}</span>
    <button type="button" class="freccia" onClick="{{next}}" aria-label="Pagina successiva"><svg class="fz7" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.9 5 H8.3"/><path d="M5.1 1.7 L8.4 5 L5.1 8.3"/></svg></button>
  </div>
  </section>
  <section class="blocco7 rivela" id="inizio7"><p class="et7">Concept</p><p class="tx7">La rivista si sviluppa attraverso quattro sezioni: il percorso personale e letterario dell'autrice, un'intervista, il racconto <em>Grazia</em> e una sezione che mette a confronto fotografie realizzate da noi e immagini generate con l'intelligenza artificiale.</p></section>
  <section class="vis7 rivela"><div style="position: relative; width: min(100%, 76vh, 720px); aspect-ratio: 1097 / 1100">
        <img src="a/4b3e5bdb03fd2f516f1f5f3f1661aba5.webp" alt="Un piatto bianco" style="position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 30px 45px rgba(0,0,0,.6))">
        <img src="a/6d98620b7c21df77aa8bb46e87b521d6.webp" alt="La scritta acito che si scrive a mano con la salsa di pomodoro" style="position: absolute; left: 17%; top: 50%; width: 66%; height: auto; transform: translateY(-50%)">
      </div></section>
  <section class="blocco7 rivela"><p class="et7">Metodo</p><p class="tx7">La parte biografica e l'intervista sono accompagnate da fotografie in bianco e nero realizzate da noi. Per <em>Grazia</em>, un racconto dalle atmosfere cupe, abbiamo scelto immagini a colori generate con l'intelligenza artificiale, creando un contrasto visivo con il testo. Nella sezione dedicata al confronto tra fotografia e AI, le immagini realizzate da noi si alternano a quelle generate, mettendo in dialogo due linguaggi visivi differenti. Anche la copertina riprende questo gioco: una parmigiana di melanzane con la scritta «Acito» diventa protagonista di due versioni, una generata con l'AI e l'altra cucinata e fotografata da noi.</p></section>
  <section class="imm7 due7 pari7"><img class="rivela" src="a/58dd2a7f7540fc15f2548c2c1d1017e7.jpg" alt="Doppia pagina dell'intervista" loading="lazy"><img class="rivela" src="a/2cdfac77a399a63c1fd36991bcfce492.jpg" alt="Doppia pagina del racconto" loading="lazy"><img class="rivela" src="a/c25b5eb0247e640ec0b148d40c1f407e.jpg" alt="Doppia pagina di Richiesta e risposta" loading="lazy"><img class="rivela" src="a/0fa5bd21af30fa26c7078c7cea5818ef.jpg" alt="Le riviste sul tavolo" loading="lazy"></section>
  <section class="blocco7 rivela"><p class="et7">Crediti</p><p class="tx7 piccolo">Fotografie, intervista e impaginazione di Marco Bruni, Riccardo Giordani ed Emma Simoncelli. Laboratorio di comunicazione 3, UniRSM, A.A. 2024-2025, prof.ssa Lucia Roscini con Sara Guazzarini.</p></section>
