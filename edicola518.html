      <p style="margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: #E6DFE8">Tre manifesti 50 × 70 cm per annunciare il temporary store che Edicola 518 avrebbe aperto all'università: un invito a lasciarsi andare all'arte.</p>

        <h2>Il segno</h2>
        <p>Un tunnel di cerchi concentrici e sfumati porta lo sguardo verso il centro, dove c'è il marchio dell'edicola; in basso, un monte rappresenta San Marino. Cambia solo il colore: i tre manifesti si riconoscono come una serie.</p>
        <h2>Crediti</h2>
