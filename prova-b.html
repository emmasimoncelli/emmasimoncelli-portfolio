      <div class="apri2" style="grid-template-rows: {{g0}}"><div><p><strong style="color: #FFFFFF">Simbiosi Group, Cattolica · gennaio 2026 – in corso</strong><br>Come figura junior del team, il mio ruolo è molto dinamico. Da una parte gestisco in totale autonomia i progetti più piccoli, dall'altra faccio da supporto ai colleghi sui lavori complessi, occupandomi spesso in prima persona della creazione delle immagini. Il mio punto forte è Illustrator, ma salto agilmente tra Photoshop, InDesign e le basi di Figma, Premiere e After Effects per dare una mano ovunque serva.</p></div></div>

      <div class="apri2" style="grid-template-rows: {{g3}}"><div><p><strong style="color: #FFFFFF">Unirsm Design · novembre 2025</strong><br>Il corso prevede un biennio multidisciplinare per formare basi solide sia nel design del prodotto che nella comunicazione. Arrivata al terzo anno, avendo la possibilità di personalizzare il piano di studi, ho scelto di specializzarmi sulla comunicazione visiva, frequentando entrambi i laboratori dedicati.</p></div></div>
