        <h2>Il lettering</h2>
        <p>Il lettering è costruito su un modulo squadrato, con angoli netti e tratti spessi: si legge bene anche al buio e diventa facilmente insegna, neon o stampa.</p>
        <h2>Il menù</h2>
        <p style="margin-bottom: 0">Il menù dei drink è bordeaux, come le luci del locale, diviso in Signature, Classic e Gin, con il pittogramma in basso a firmare la pagina.</p>

        <a href="mailto:emmasic2002@gmail.com" tabindex="{{tabC}}">emmasic2002@gmail.com</a>
        <span>Riccione (RN), Italia</span>
        <a href="https://www.linkedin.com/in/emma-simoncelli-aa0231378/" tabindex="{{tabC}}">LinkedIn</a>
        <a href="https://www.instagram.com/emmasimoncelli/" tabindex="{{tabC}}" style="border-bottom: 1px solid rgba(255,255,255,.28)">Instagram</a>

    </div>
